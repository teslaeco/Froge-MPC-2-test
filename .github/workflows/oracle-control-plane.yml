name: Oracle Codex MCP (no paid API)
on:
  pull_request:
    paths:
      - 'oracle_connector/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-v34.py'
      - 'scripts/cloud-shell-v34.template.py'
      - 'scripts/package-v35.py'
      - 'scripts/cloud-shell-v35.template.py'
      - 'docs/reviews/v35/**'
      - 'scripts/package-v27.py'
      - 'scripts/cloud-shell-v27.template.py'
      - 'scripts/package-v33.py'
      - 'scripts/cloud-shell-v33.template.py'
      - 'scripts/package-v32.py'
      - 'scripts/cloud-shell-v32.template.py'
      - 'scripts/package-v31.py'
      - 'scripts/cloud-shell-v31.template.py'
      - 'scripts/package-v30.py'
      - 'scripts/cloud-shell-v30.template.py'
      - 'scripts/package-v29.py'
      - 'scripts/cloud-shell-v29.template.py'
      - 'scripts/package-v28.py'
      - 'scripts/cloud-shell-v28.template.py'
      - '.github/workflows/oracle-control-plane.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Lint review source
        run: npm run lint
      - name: Typecheck review source
        run: npm run typecheck
      - name: Frontend regression tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install numerical dependency for reference fitting tests
        run: python -m pip install numpy==1.26.4
      - name: Unit and rollback regressions
        working-directory: oracle_connector
        run: python -m unittest test_reference_anatomy test_portrait_quality test_blender_mcp test_update test_agent_execution test_agent_lifecycle test_mcp_snapshot test_codex_binary_integrity test_worker_handoff test_delta_update test_connector test_openai test_reference_reconstruction test_validation_preflight test_reference_acceptance test_release_contract
      - name: Install checksum-pinned Codex and Code Mode host
        working-directory: oracle_connector
        run: python install_codex.py
      - name: Actual Codex to MCP round-trip with fixture Responses
        working-directory: oracle_connector
        run: python codex_smoke.py
      - name: Install official Blender 4.3 for real build test
        if: matrix.python == '3.9'
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0-linux-x64.tar.xz --output /tmp/blender-4.3.0-linux-x64.tar.xz
          curl --fail --location --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.0.sha256 --output /tmp/blender-4.3.0.sha256
          cd /tmp
          sha256sum --check --ignore-missing blender-4.3.0.sha256
          tar -xf blender-4.3.0-linux-x64.tar.xz
      - name: Actual Codex, MCP, Blender geometry, render images and FBX
        if: matrix.python == '3.9'
        working-directory: oracle_connector
        run: python codex_smoke.py --build --test-blender /tmp/blender-4.3.0-linux-x64/blender
      - name: Real Blender edit palette and geometry helper regressions
        if: matrix.python == '3.9'
        working-directory: oracle_connector
        run: /tmp/blender-4.3.0-linux-x64/blender --background --python-exit-code 1 --python verify_edit_runtime.py
      - name: Real Blender rooted-hair attachment and camera regression
        if: matrix.python == '3.9'
        working-directory: oracle_connector
        run: /tmp/blender-4.3.0-linux-x64/blender --background --python-exit-code 1 --python verify_camera_hair_runtime.py
      - name: Real Blender anatomy edits and diagnostics
        if: matrix.python == '3.9'
        working-directory: oracle_connector
        run: /tmp/blender-4.3.0-linux-x64/blender --background --python-exit-code 1 --python verify_anatomy_edit.py
      - name: Real Blender assigned atlas and nested material regressions
        if: matrix.python == '3.9'
        working-directory: oracle_connector
        run: /tmp/blender-4.3.0-linux-x64/blender --background --python-exit-code 1 --python verify_skin_atlas_runtime.py -- --output /tmp/froge-v35-atlas-check
      - name: Verify board geometry and flat material colours in Blender
        if: matrix.python == '3.9'
        working-directory: oracle_connector
        run: /tmp/blender-4.3.0-linux-x64/blender --background --python-exit-code 1 --python verify_board_review_blender.py
      - name: Build verified Oracle v35 update from this commit
        if: matrix.python == '3.9'
        run: python scripts/package-v35.py
      - uses: actions/upload-artifact@v4
        if: success() && matrix.python == '3.9'
        with:
          name: froge-v35-${{ github.event.pull_request.head.sha || github.sha }}
          path: public/downloads/froge-v35.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: codex-diagnostics-py-${{ matrix.python }}
          path: oracle_connector/state/diagnostics/
          if-no-files-found: ignore
